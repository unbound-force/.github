# Repo-specific overrides for unbound-force.
# Only fields that differ from the org/suborg defaults.
#
# Colors are quoted and keep GitHub's stored case: safe-settings compares
# them as exact strings, and an unquoted 000000 would parse as a number.

# The repo's homepage: its page on the Unbound Force site.
repository:
  homepage: https://unboundforce.dev/
  has_discussions: true

labels:
  include:
    - name: hero
      color: '006b75'
      description: Hero architecture implementation

    - name: phase-1
      color: 0e8a16
      description: "Phase 1: Hero Architectures"

    - name: phase-2
      color: fbca04
      description: "Phase 2: Cross-Cutting Concerns"

    - name: spec-005
      color: 1d76db
      description: "Spec 005: The Divisor Architecture"

    - name: spec-006
      color: 5319ef
      description: "Spec 006: Cobalt-Crush Architecture"

    - name: spec-007
      color: e99695
      description: "Spec 007: Mx F Architecture"

    - name: spec-008
      color: f9d0c4
      description: "Spec 008: Swarm Orchestration"

    - name: spec-009
      color: c2e0c6
      description: "Spec 009: Shared Data Model"

    # Labels in use on issues and PRs. Without these entries the
    # exclude rule below would delete them.
    - name: blog
      color: '0E8A16'
      description: "Blog post opportunity"

    - name: docs
      color: '0075ca'
      description: "Documentation updates needed"

    - name: feature
      color: 'ededed'
      description: "New feature request"

    - name: llm_assisted
      color: '9f6c38'
      description: "Issue triaged or authored with LLM assistance"

    - name: next-release
      color: 'c1c8f3'
      description: "Targeted for inclusion in next release but can be deferred if needed"

    - name: opencode-v2-migration
      color: '5319E7'
      description: "Org-wide OpenCode v2 migration (umbrella-tracked)"

    - name: triaged
      color: 'ededed'
      description: "Issue has been triaged"

    - name: tutorial
      color: '1D76DB'
      description: "Tutorial opportunity"

    # Created by Dependabot for its PRs.
    - name: dependabot
      color: '0d4b2a'
      description: "Issues related to dependabot configurations"

    - name: github_actions
      color: '000000'
      description: "Pull requests that update GitHub Actions code"

    - name: go
      color: '16e2e2'
      description: "Pull requests that update go code"

    # Used by the fullsend agent workflow (.github/workflows/fullsend.yaml):
    # ready-* labels trigger agent dispatch, risk/* labels rate PRs.
    - name: needs-human
      color: 'D93F0B'
      description: "Agent loop needs human intervention"

    - name: ready-for-merge
      color: '0E8A16'
      description: "All reviewers approved — ready to merge"

    - name: ready-for-review
      color: '0E8A16'
      description: "Triggers review agent dispatch"

    - name: ready-for-triage
      color: '0E8A16'
      description: "Triggers triage agent dispatch"

    - name: ready-to-code
      color: '0E8A16'
      description: "Triggers code agent dispatch"

    - name: requires-manual-review
      color: 'FBCA04'
      description: "Review requires human judgment"

    - name: risk/elevated
      color: 'E4A221'
      description: "PR risk: elevated"

    - name: risk/low
      color: '0E8A16'
      description: "PR risk: low"

    - name: risk/moderate
      color: 'FBCA04'
      description: "PR risk: moderate"

    # Used by gh-hud to block auto-merge.
    - name: hold
      color: 'B60205'
      description: "gh-hud: don't auto-merge; a person looks first"
  exclude:
    - name: ".*"

# Required checks for this repo only. The org ruleset is shared, so a check
# there would be required in repos that never run it. GitHub applies both
# rulesets, so the org ruleset's approval rule still holds.
#
# The required checks are the aggregate jobs from unbound-force's
# ci_local.yml ("CI OK") and ci_checks.yml ("Standardized CI OK"). Each runs
# under if: always() and fails unless every job it gates succeeded or was
# skipped, so PRs that only add Dewey learnings can skip the heavy jobs and
# still pass. Do not require "Standardized CI / Run linters" again: a skipped
# reusable-workflow caller never reports that nested check.
rulesets:
  - name: "safe-settings: unbound-force required checks"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "CI OK"
            - context: "Standardized CI OK"

  # Release tags are immutable: once a v* tag exists it can't be deleted or
  # moved. Creation is allowed, so the release workflow can create the tag.
  # Org admins may bypass to repair a bad tag. The same ruleset as dewey,
  # gaze and replicator. New: unbound-force releases v* tags without
  # it.
  - name: release-tag-protection
    target: tag
    enforcement: active

    conditions:
      ref_name:
        include:
          - "refs/tags/v*"
        exclude: []

    bypass_actors:
      - actor_id: null
        actor_type: OrganizationAdmin
        bypass_mode: always

    rules:
      - type: deletion
      - type: non_fast_forward
