# Repo-specific overrides for intake-kit.
# Only fields that differ from the org/suborg defaults.

# The repo's homepage: its page on the Unbound Force site.
repository:
  homepage: https://unboundforce.dev/docs/roadmap/#the-three-layer-intake-ecosystem
  # Subject topics; the org-wide unbound-force topic comes from
  # settings.yml and is combined with these on sync.
  topics:
    - cue
    - product-requirements
    - prd
    - ai-code-review
    - lola

# Required checks for this repo only. The org ruleset is shared, so a check
# there would be required in repos that never run it. GitHub applies both
# rulesets, so the org ruleset's approval rule still holds.
#
# "test" is intake-kit's ci.yml job (task vet-examples).
# jflowers/ship's deps-automerge.yml needs a required check before it
# turns on auto-merge for a Dependabot PR, so nothing merges before CI.
rulesets:
  - name: "safe-settings: intake-kit required checks"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "test"

  # Release tags are immutable: once a v* tag exists it can't be deleted or
  # moved. Creation is allowed, so the release workflow can create the tag.
  # Org admins may bypass to repair a bad tag. The same ruleset as dewey,
  # gaze and replicator. New: intake-kit releases v* tags without
  # it.
  - name: release-tag-protection
    target: tag
    enforcement: active

    conditions:
      ref_name:
        include:
          - "refs/tags/v*"
        exclude: []

    bypass_actors:
      - actor_id: null
        actor_type: OrganizationAdmin
        bypass_mode: always

    rules:
      - type: deletion
      - type: non_fast_forward

# Labels in use on issues and PRs. Without these entries the org's
# exclude rule would delete them on a sync. hold and human-gate are
# gh-hud's (it auto-merges PRs here); github_actions and go are
# Dependabot's. Colors are quoted and keep GitHub's stored case:
# safe-settings compares them as exact strings.
labels:
  include:
    - name: "github_actions"
      color: '000000'
      description: "Pull requests that update GitHub Actions code"
  exclude:
    - name: ".*"
