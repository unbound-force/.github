# Repo-specific overrides for gaze.
# Only fields that differ from the org/suborg defaults.

# The repo's homepage: its page on the Unbound Force site.
repository:
  homepage: https://unboundforce.dev/docs/projects/gaze/

# Labels in use on issues and PRs. Without these entries the org's
# exclude rule would delete them on a sync. hold and human-gate are
# gh-hud's (it auto-merges PRs here); github_actions and go are
# Dependabot's. Colors are quoted and keep GitHub's stored case:
# safe-settings compares them as exact strings.
labels:
  include:
    - name: "blocked"
      color: 'ededed'

    - name: "feature"
      color: 'ededed'

    - name: "hold"
      color: 'B60205'
      description: "gh-hud: don't auto-merge; a person looks first"

    - name: "next-release"
      color: 'c1c8f3'
      description: ""

    - name: "not-planned"
      color: 'ededed'

    - name: "ready-for-merge"
      color: '0E8A16'
      description: "All reviewers approved \u2014 ready to merge"

    - name: "ready-for-review"
      color: '0E8A16'
      description: "Triggers review agent dispatch"

    - name: "ready-for-triage"
      color: '0E8A16'
      description: "Triggers triage agent dispatch"

    - name: "ready-to-code"
      color: '0E8A16'
      description: "Triggers code agent dispatch"

    - name: "requires-manual-review"
      color: 'FBCA04'
      description: "Review requires human judgment"

    - name: "risk/elevated"
      color: 'E4A221'
      description: "PR risk: elevated"

    - name: "risk/low"
      color: '0E8A16'
      description: "PR risk: low"

    - name: "risk/moderate"
      color: 'FBCA04'
      description: "PR risk: moderate"

    - name: "triaged"
      color: 'ededed'

    - name: "github_actions"
      color: '000000'
      description: "Pull requests that update GitHub Actions code"

    - name: "go"
      color: '16e2e2'
      description: "Pull requests that update go code"
  exclude:
    - name: ".*"

# Rulesets for this repo only. Repo-scoped rulesets are fully managed here:
# a sync deletes any repo ruleset on gaze that isn't listed.
rulesets:
  # Required checks, moved here from the classic branch protection on main,
  # which was set by hand with strict: true. The same check, not strict: with auto-merge
  # (jflowers/ship's deps-automerge.yml), each merge would otherwise leave
  # every other open PR behind, and updating one needs a fresh approval. The
  # org ruleset still requires the code owner's approval.
  #
  # "CI OK" is ci.yml's aggregate job, which always reports.
  - name: "safe-settings: gaze required checks"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "CI OK"

  # Release tags are immutable: once a v* tag exists it can't be deleted or
  # moved. Creation is allowed, so the release workflow can create the tag.
  # Org admins may bypass to repair a bad tag. The same ruleset as dewey,
  # gaze and replicator. Declared as it already exists
  # (created outside safe-settings), so a sync keeps it.
  - name: release-tag-protection
    target: tag
    enforcement: active

    conditions:
      ref_name:
        include:
          - "refs/tags/v*"
        exclude: []

    bypass_actors:
      - actor_id: null
        actor_type: OrganizationAdmin
        bypass_mode: always

    rules:
      - type: deletion
      - type: non_fast_forward
