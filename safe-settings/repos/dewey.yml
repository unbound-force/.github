# Repo-specific overrides for dewey.
# Only fields that differ from the org/suborg defaults.

# The repo's homepage: its page on the Unbound Force site.
repository:
  homepage: https://unboundforce.dev/docs/projects/dewey/

# Labels in use on issues and PRs. Without these entries the org's
# exclude rule would delete them on a sync. hold and human-gate are
# gh-hud's (it auto-merges PRs here); github_actions and go are
# Dependabot's. Colors are quoted and keep GitHub's stored case:
# safe-settings compares them as exact strings.
labels:
  include:
    - name: "feature"
      color: 'ededed'
      description: ""

    - name: "github_actions"
      color: '000000'
      description: "Pull requests that update GitHub Actions code"

    - name: "go"
      color: '16e2e2'
      description: "Pull requests that update go code"

    - name: "hold"
      color: 'B60205'
      description: "gh-hud: don't auto-merge; a person looks first"

    - name: "human-gate"
      color: 'd93f0b'
      description: "Tooling hands-off: bots must not approve, merge, or force through; CODEOWNERS enforces the gate."

    - name: "next-release"
      color: 'c1c8f3'
      description: "Targeted for inclusion in next release but can be deferred if needed"

    - name: "pr-open"
      color: 'D4C5F9'
      description: "An open PR already addresses this issue"

    - name: "ready-for-merge"
      color: '0E8A16'
      description: "All reviewers approved \u2014 ready to merge"

    - name: "risk/low"
      color: '0E8A16'
      description: "PR risk: low"

    - name: "risk/moderate"
      color: 'FBCA04'
      description: "PR risk: moderate"

    - name: "triaged"
      color: 'ededed'
      description: ""
  exclude:
    - name: ".*"
