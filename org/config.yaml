orgs:
  unbound-force:
    # Org settings
    # The org website (unboundforce.dev) is set through the API; peribolos
    # has no field for it.
    name: Unbound Force
    description: >-
      A superhero team of AI agents that turn specs into reviewed, tested code.
      Its junior team trains at Zero Dot Force.
    billing_email: jay.flowers@gmail.com
    default_repository_permission: read
    has_organization_projects: true
    has_repository_projects: true
    members_can_create_repositories: false

    # Org members
    admins:
      - jflowers
      - marcusburghardt
      - sonupreetam
      - yvonnedevlinrh
    members:
      - beatrizmcouto
      - cdaniels255
      - em-redhat
      - gxmiranda
      - hbraswelrh
      - jpower432
      - sedonnel
      - trevor-vaughan
      - tyraziel
      - uf-divisor

    # Repos managed by peribolos
    repos:
      .github:
        default_branch: main
        description: Organization-wide GitHub configuration
        has_projects: true
      containerfile:
        default_branch: main
        description: "Podman image that runs OpenCode and the full Unbound Force toolchain in an isolated, rootless container."
        has_projects: true
      dewey:
        default_branch: main
        description: "Knowledge graph MCP server for AI agents: semantic search and persistent memory over Logseq and Obsidian vaults, GitHub, web docs and code."
        has_projects: true
      eval-infra:
        default_branch: main
        description: "Eval harness that measures how efficiently and effectively OpenCode agents use tokens."
        has_projects: true
      gaze:
        default_branch: main
        description: "Static analysis for Go that detects side effects and scores test quality: know whether AI-generated tests actually verify behavior, not just cover lines."
        has_projects: true
      homebrew-tap:
        default_branch: main
        description: "Homebrew tap for the `uf` CLI, Gaze, Dewey and Replicator."
        has_projects: true
      intake-kit:
        default_branch: main
        description: A CUE-validated PRD authoring and review system for structured project intake
        has_projects: true
      replicator:
        default_branch: main
        description: "Multi-agent coordination for AI coding agents: work tracking, messaging, task decomposition in isolated git worktrees, and memory via Dewey. One Go binary."
        has_projects: true
      unbound-force:
        default_branch: main
        description: "The `uf` CLI and hero agents of Unbound Force: a superhero team of AI agents that turns specs into reviewed, tested code."
        has_projects: true
      website:
        default_branch: main
        description: "Source for unboundforce.dev: docs, hero profiles, roadmap and blog."
        has_projects: true

    # Teams
    teams:
      overlords:
        description: ""
        privacy: closed
        members:
          - beatrizmcouto
          - cdaniels255
          - em-redhat
          - gxmiranda
          - hbraswelrh
          - jpower432
          - sedonnel
          - trevor-vaughan
          - uf-divisor
        maintainers:
          - jflowers
          - marcusburghardt
          - sonupreetam
          - yvonnedevlinrh
        repos:
          .github: write
          containerfile: write
          dewey: write
          eval-infra: write
          gaze: write
          homebrew-tap: write
          intake-kit: write
          replicator: write
          unbound-force: write
          website: write
