orgs:
  unbound-force:
    # Org settings
    billing_email: jay.flowers@gmail.com
    default_repository_permission: read
    has_organization_projects: true
    has_repository_projects: true
    members_can_create_repositories: false

    # Org members
    admins:
      - jflowers
      - marcusburghardt
      - sonupreetam
      - yvonnedevlinrh
    members:
      - beatrizmcouto
      - cdaniels255
